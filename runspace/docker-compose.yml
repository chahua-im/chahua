name: ${COMPOSE_PROJECT_NAME:?Run node runspace/dev.mjs init first}

services:
  postgres:
    restart: unless-stopped
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: wetty_chat
      POSTGRES_PASSWORD: local-chat-password
      POSTGRES_DB: wetty_chat
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wetty_chat -d wetty_chat"]
      interval: 2s
      timeout: 5s
      retries: 30
  meilisearch:
    restart: unless-stopped
    image: getmeili/meilisearch:v1.37
    ports:
      - "127.0.0.1:${MEILI_PORT}:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch_data:/meili_data
  rustfs:
    restart: unless-stopped
    image: rustfs/rustfs:latest
    ports:
      - "127.0.0.1:${S3_PORT}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT}:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: ${AWS_REGION}
    command: /data --console-enable --address ":9000"
    volumes:
      - rustfs_data:/data
  storage-init:
    image: minio/mc:latest
    profiles: ["init"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://rustfs:9000 "$$AWS_ACCESS_KEY_ID" "$$AWS_SECRET_ACCESS_KEY"
        mc mb --ignore-existing --region "$$AWS_DEFAULT_REGION" "local/$$S3_BUCKET_NAME"
        mc anonymous set download "local/$$S3_BUCKET_NAME"
        cat > /tmp/cors.xml <<'XML'
        <CORSConfiguration><CORSRule><AllowedOrigin>*</AllowedOrigin><AllowedMethod>GET</AllowedMethod><AllowedMethod>PUT</AllowedMethod><AllowedMethod>HEAD</AllowedMethod><AllowedHeader>*</AllowedHeader><ExposeHeader>ETag</ExposeHeader></CORSRule></CORSConfiguration>
        XML
        mc cors set "local/$$S3_BUCKET_NAME" /tmp/cors.xml

volumes:
  postgres_data:
  meilisearch_data:
  rustfs_data:

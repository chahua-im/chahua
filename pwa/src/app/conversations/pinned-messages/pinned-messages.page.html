<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-back-button text="返回" [defaultHref]="backHref()"></ion-back-button></ion-buttons>
    <ion-title>置顶消息</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content
  appScrollbars
  [scrollEvents]="true"
  (ionScroll)="onScroll()"
  (ionScrollStart)="scrolling.scrollStart()"
  (ionScrollEnd)="scrolling.scrollEnd()"
  (touchstart)="scrolling.touchStart()"
  (touchend)="scrolling.touchEnd()"
  (touchcancel)="scrolling.touchEnd()">
  <span
    slot="fixed"
    #floatingDate
    class="floating-date"
    [class.scrolling]="scrolling.moving() && visibleDate()"
    [class.colliding]="dateColliding() || !visibleDate()">
    {{ visibleDate() | date: 'yyyy年M月d日' }}
  </span>
  <div class="message-list">
    @for (row of rows(); track row.message.id; let index = $index) {
      @if (row.dateBreak) {
        <p
          #dateSeparator
          class="message-date"
          [style.visibility]="
            scrolling.moving() && !dateColliding() && hiddenDateKey() === index ? 'hidden' : 'visible'
          ">
          <span>{{ row.message.createdAt | date: 'yyyy年M月d日' }}</span>
        </p>
      }
      <app-message
        [showAllAvatars]="preferences.showAllAvatars()"
        [message]="row.message"
        [own]="row.message.sender.uid === session.user()?.uid"
        [first]="row.first"
        [last]="row.last"
        [busy]="row.message.id != null && menu()?.busyMessageId() === row.message.id"
        [canReply]="!menu()?.busy()"
        [canOpenThread]="!threadId()"
        (reply)="replyTo($event)"
        (menu)="menu()?.open($event)"
        (react)="menu()?.reactTo(row.message, $event)"
        (jump)="locateMessage(row.message, $event)"
        (openThread)="openThread(row.message.chatId, $event)"></app-message>
    } @empty {
      @if (!loading() && !failed()) {
        <p class="ion-text-center">暂无置顶消息</p>
      }
    }
  </div>
  @if (loading()) {
    <div class="page-loading">
      <ion-spinner></ion-spinner>
    </div>
  }
  @if (failed()) {
    <app-load-error message="消息加载失败，请重试。" (retry)="load()" />
  }
</ion-content>
<app-message-menu
  [messages]="messages()"
  [chatId]="id()"
  [threadId]="threadId()"
  (reply)="replyTo($event)"
  (openThread)="openThread(id(), $event)"></app-message-menu>

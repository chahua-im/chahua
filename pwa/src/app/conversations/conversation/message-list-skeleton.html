@for (row of [0, 1, 2, 3, 4, 5]; track row) {
  <div class="message-skeleton-item">
    <div
      class="chat-row"
      [class.sent]="row % 3 === 2"
      [class.short]="row % 2 === 0"
      [class.group-start]="row % 3 !== 1"
      [class.last]="row % 3 !== 0 || showAllAvatars()"
      [class.no-details]="!showDetails()">
      @if (showDetails()) {
        <span class="avatar-slot">
          @if (row % 3 !== 0 || showAllAvatars()) {
            <span class="avatar skeleton-block message-skeleton-avatar"></span>
          }
        </span>
      }
      <div class="bubble message-skeleton-bubble">
        <div class="bubble-surface">
          @if (row % 3 !== 1 && showDetails()) {
            <span class="skeleton-line message-skeleton-author"></span>
          }
          <span class="skeleton-line"></span>
          @if (row % 3 === 0) {
            <span class="skeleton-line"></span>
          }
        </div>
      </div>
    </div>
  </div>
}

<app-sticker-editor
  #stickerEditor
  [title]="'stickers.fromMessage.title' | transloco"
  [withEmoji]="true"
  [busy]="busy() || creatingPack()"
  [saveDisabled]="saveDisabled()"
  [error]="errorKey() ? errorText() : undefined"
  [content]="destination"
  (confirmed)="save($event)"
  (closed)="dismissed()" />

<ng-template #destination>
  <ion-item lines="none">
    <img class="preview" [src]="message().attachments[0]?.url" />
  </ion-item>
  <ion-item>
    <ion-select
      [label]="'stickers.fromMessage.pack' | transloco"
      [cancelText]="'common.cancel' | transloco"
      [okText]="'common.confirm' | transloco"
      [disabled]="busy() || creatingPack() || !orderedPacks().length"
      [value]="packId()"
      (ionChange)="packId.set($event.detail.value)">
      @for (pack of orderedPacks(); track pack.id) {
        <ion-select-option [value]="pack.id">{{ pack.name }}</ion-select-option>
      }
    </ion-select>
    <ion-button slot="end" fill="solid" [disabled]="busy() || creatingPack()" (click)="createPack()">
      {{ 'common.create' | transloco }}
    </ion-button>
  </ion-item>
  @if (!orderedPacks().length) {
    <ion-item lines="none">
      <ion-note>{{ 'stickers.fromMessage.noOwnedPacks' | transloco }}</ion-note>
    </ion-item>
  }
</ng-template>

@if (createOpen()) {
  <app-sticker-editor
    #packEditor
    [title]="'stickers.createPack' | transloco"
    [busy]="creatingPack()"
    [error]="createFailed() ? ('stickers.createFailed' | transloco) : undefined"
    (confirmed)="savePack($event)"
    (closed)="createOpen.set(false)" />
}

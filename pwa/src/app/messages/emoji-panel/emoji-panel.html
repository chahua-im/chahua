<div #panel class="emoji-panel">
  <div class="picker-header">
    @if (!closeButton()) {
      <app-modal-button back (pressed)="back.emit()" />
    }
    <span>{{ title() }}</span>
    @if (closeButton()) {
      <app-modal-button class="picker-close" (pressed)="dismissed.emit()" />
    }
  </div>
  @defer (when contentReady(); prefetch on idle) {
    <app-emoji-picker [active]="active()" (chosen)="chosen.emit($event)" />
  } @loading (after 100ms) {
    <div class="loading-status"><ion-spinner /></div>
  } @error {
    <app-load-error compact [retryable]="false" [message]="'emojiPicker.loadFailed' | transloco" />
  }
</div>

<button type="button" class="thread-entry" [disabled]="preview()" (click)="open.emit()">
  <span class="label">
    <ion-icon [icon]="icons.chatbubbles"></ion-icon>
    {{ 'messages.thread.replies' | transloco: { count: info().replyCount } }}
  </span>
  <ion-icon class="arrow" [icon]="icons.chevronForward"></ion-icon>
</button>

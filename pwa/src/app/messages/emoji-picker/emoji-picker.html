<emoji-picker
  locale="zh"
  data-source="/emoji/data.json"
  [i18n]="{
    emojiUnsupportedMessage: '浏览器不支持彩色表情。',
    loadingMessage: '正在加载…',
    networkErrorMessage: '表情加载失败，请重新打开重试。',
    searchLabel: '搜索表情',
    skinToneLabel: '选择肤色（当前为 {skinTone}）',
    skinTones: ['默认', '浅色', '较浅', '中等', '较深', '深色'],
    categories: {
      custom: '自定义',
      'smileys-emotion': '笑脸和表情',
      'people-body': '人物和身体',
      'animals-nature': '动物与自然',
      'food-drink': '食品饮料',
      'travel-places': '旅行和地点',
      activities: '活动',
      objects: '物品',
      symbols: '符号',
      flags: '旗帜',
    },
  }"
  (emoji-click)="choose($event)"></emoji-picker>

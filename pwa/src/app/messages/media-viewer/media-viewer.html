<ion-header>
  <ion-toolbar>
    <ion-title>{{ index() + 1 }} / {{ images().length }}</ion-title>
    <ion-buttons slot="start"><ion-button (click)="modals.dismiss()">完成</ion-button></ion-buttons>
    <ion-buttons slot="end">
      <ion-button [href]="current().url" target="_blank" rel="noopener">原图</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content [scrollX]="zoom()" [scrollY]="zoom()">
  <div
    class="viewer"
    [class.zoom]="zoom()"
    (touchstart)="start($event)"
    (touchend)="end($event)"
    (dblclick)="zoom.set(!zoom())">
    <img [src]="current().url" />
  </div>
</ion-content>
<ion-toolbar>
  <ion-buttons slot="start"><ion-button [disabled]="index() === 0" (click)="move(-1)">上一张</ion-button></ion-buttons>
  <ion-buttons slot="end">
    <ion-button (click)="zoom.set(!zoom())">{{ zoom() ? '适应屏幕' : '放大' }}</ion-button>
    <ion-button [disabled]="index() === images().length - 1" (click)="move(1)">下一张</ion-button>
  </ion-buttons>
</ion-toolbar>

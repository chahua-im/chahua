<ion-list>
  @for (member of members(); track member.uid) {
    <ion-item [button]="true" [detail]="false" [routerLink]="['/profile', member.uid]">
      <app-chat-avatar
        slot="start"
        [size]="40"
        [entry]="{ avatar: member.avatarUrl, title: member.username ?? member.uid.toString() }" />
      <ion-label>{{ member.username || member.uid }}</ion-label>
      @if (member.role === Role.admin) {
        <ion-note slot="end">管理员</ion-note>
      }
    </ion-item>
  }
</ion-list>
@if (cursor() != null && !error()) {
  <ion-infinite-scroll threshold="100px" (ionInfinite)="more($event)">
    <ion-infinite-scroll-content />
  </ion-infinite-scroll>
}
@if (loading()) {
  <div class="loading-status"><ion-spinner /></div>
}
@if (error()) {
  <p class="ion-padding">
    加载失败，请重试。
    <ion-button fill="clear" (click)="load()">刷新</ion-button>
  </p>
}

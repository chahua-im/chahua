<ion-action-sheet
  [header]="'notificationPreferences.chatSettings' | transloco"
  [buttons]="
    notificationButtons([
      { text: ('notificationPreferences.inherit' | transloco), role: 'selected', data: { mode: Mode.inherit } },
      {
        text: ('notificationPreferences.alwaysUnmuted' | transloco),
        role: 'selected',
        data: { mode: Mode.alwaysUnmuted },
      },
      { text: ('notificationPreferences.alwaysMuted' | transloco), role: 'selected', data: { mode: Mode.alwaysMuted } },
      {
        text: ('chats.list.mute.oneHour' | transloco),
        role: 'selected',
        data: { mode: Mode.temporarilyMuted, durationSeconds: 3600 },
      },
      {
        text: ('chats.list.mute.eightHours' | transloco),
        role: 'selected',
        data: { mode: Mode.temporarilyMuted, durationSeconds: 28800 },
      },
      {
        text: ('chats.list.mute.oneDay' | transloco),
        role: 'selected',
        data: { mode: Mode.temporarilyMuted, durationSeconds: 86400 },
      },
      {
        text: ('chats.list.mute.sevenDays' | transloco),
        role: 'selected',
        data: { mode: Mode.temporarilyMuted, durationSeconds: 604800 },
      },
      { text: ('common.cancel' | transloco), role: 'cancel' },
    ])
  " />

<ion-action-sheet
  [header]="'chats.list.mute.title' | transloco"
  [buttons]="[
    { text: ('chats.list.mute.oneHour' | transloco), role: 'selected', data: { seconds: 3600 } },
    { text: ('chats.list.mute.eightHours' | transloco), role: 'selected', data: { seconds: 28800 } },
    { text: ('chats.list.mute.oneDay' | transloco), role: 'selected', data: { seconds: 86400 } },
    { text: ('chats.list.mute.sevenDays' | transloco), role: 'selected', data: { seconds: 604800 } },
    { text: ('chats.list.mute.forever' | transloco), role: 'selected', cssClass: 'mute-permanent', data: {} },
    { text: ('common.cancel' | transloco), role: 'cancel' },
  ]" />

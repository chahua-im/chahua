<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="modals.dismiss()">
        <ion-icon slot="start" [icon]="backIcon"></ion-icon>
        返回
      </ion-button>
    </ion-buttons>
    <ion-title>通用</ion-title>
    <ion-buttons slot="end"><ion-button (click)="modals.dismiss()">完成</ion-button></ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content appScrollbars color="light">
  <ion-list [inset]="true">
    <ion-item>
      <ion-icon slot="start" [icon]="threadsIcon" color="primary"></ion-icon>
      <ion-toggle
        [checked]="preferences.showThreadsInMessages()"
        (ionChange)="preferences.setShowThreadsInMessages($event.detail.checked)">
        <span class="ion-text-wrap">在“消息”标签页中显示话题</span>
      </ion-toggle>
    </ion-item>
    <ion-item lines="none">
      <ion-icon slot="start" [icon]="avatarsIcon" color="primary"></ion-icon>
      <ion-toggle
        [checked]="preferences.showAllAvatars()"
        (ionChange)="preferences.setShowAllAvatars($event.detail.checked)">
        <span class="ion-text-wrap">在所有消息旁显示头像</span>
      </ion-toggle>
    </ion-item>
  </ion-list>
  <ion-list [inset]="true">
    <ion-list-header>颜色模式</ion-list-header>
    <ion-radio-group [value]="preferences.colorMode()" (ionChange)="setColorMode($event.detail.value)">
      <ion-item>
        <ion-icon slot="start" [icon]="systemIcon" color="primary"></ion-icon>
        <ion-radio [value]="ColorMode.System">跟随系统</ion-radio>
      </ion-item>
      <ion-item>
        <ion-icon slot="start" [icon]="lightIcon" color="primary"></ion-icon>
        <ion-radio [value]="ColorMode.Light">浅色</ion-radio>
      </ion-item>
      <ion-item lines="none">
        <ion-icon slot="start" [icon]="darkIcon" color="primary"></ion-icon>
        <ion-radio [value]="ColorMode.Dark">深色</ion-radio>
      </ion-item>
    </ion-radio-group>
  </ion-list>
</ion-content>

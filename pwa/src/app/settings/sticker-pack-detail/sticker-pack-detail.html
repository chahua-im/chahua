<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="modals.dismiss()">
        <ion-icon slot="start" [icon]="backIcon"></ion-icon>
        返回
      </ion-button>
    </ion-buttons>
    <ion-title>{{ pack()?.name || '贴纸包' }}</ion-title>
    <ion-buttons slot="end">
      @if (pack(); as pack) {
        @if (owned()) {
          <ion-button [disabled]="busy()" (click)="rename()">
            <ion-icon slot="icon-only" [icon]="icons.createOutline"></ion-icon>
          </ion-button>
          <ion-button [disabled]="busy()" color="danger" (click)="deletePack()">
            <ion-icon slot="icon-only" [icon]="icons.trashOutline"></ion-icon>
          </ion-button>
        } @else {
          <ion-button [disabled]="busy()" color="danger" (click)="unsubscribe()">取消订阅</ion-button>
        }
      }
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content appScrollbars color="light">
  @if (pack(); as current) {
    <input #stickerFile type="file" accept="image/*,video/webm" hidden (change)="upload($event)" />
    @if (owned()) {
      <p class="hint">点按贴纸可将其从贴纸包中移除。</p>
    }
    <div class="grid">
      @if (owned()) {
        <button type="button" class="cell add" [disabled]="busy()" (click)="stickerFile.click()">+</button>
      }
      @for (sticker of current.stickers; track sticker.id) {
        <button
          type="button"
          class="cell"
          [disabled]="!owned() || busy()"
          (click)="removeSticker(sticker)">
          @if (sticker.media.contentType.startsWith('video/')) {
            <video [src]="sticker.media.url" autoplay loop [muted]="true" playsinline preload="metadata"></video>
          } @else {
            <img [src]="sticker.media.url" loading="lazy" decoding="async" />
          }
          @if (owned()) {
            <span class="remove">✕</span>
          }
        </button>
      }
    </div>
  } @else if (error()) {
    <p class="ion-padding">
      加载失败。
      <ion-button fill="clear" (click)="retry()">重试</ion-button>
    </p>
  } @else {
    <div class="loading-status"><ion-spinner /></div>
  }
</ion-content>
<ion-toast [isOpen]="!!notice()" [message]="notice()" [duration]="2500" (didDismiss)="notice.set(undefined)" />

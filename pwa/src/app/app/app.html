@if (!session.token()) {
  <h1>418 I'm a teapot</h1>
} @else {
  <ion-app>
    @if (landingPage()) {
      <ion-router-outlet [swipeGesture]="false" />
    } @else if (session.user()) {
      <ion-split-pane when="md" contentId="main" (ionSplitPaneVisible)="splitPaneVisible.set($event.detail.visible)">
        <ion-menu contentId="main" [swipeGesture]="false">
          @if (splitPaneVisible()) {
            <app-chat-list [selection]="sidebarSelection()" (openList)="sidebarSelection.set($event)"></app-chat-list>
          }
        </ion-menu>
        <!-- Browser history owns the edge swipe; a second gesture would overlap Safari's transition. -->
        <ion-router-outlet
          #outlet
          id="main"
          [animated]="!splitPaneVisible()"
          [swipeGesture]="false"
          (stackWillChange)="prepareTransition(outlet)"></ion-router-outlet>
      </ion-split-pane>
      <app-settings-modal />
      <app-notification-prompt />
    } @else {
      @if (loading()) {
        <ion-header>
          <ion-toolbar>
            <ion-buttons slot="end">
              <ion-button>
                <ion-spinner class="action-icon" slot="icon-only" />
              </ion-button>
            </ion-buttons>
          </ion-toolbar>
        </ion-header>
      }
      <ion-content appScrollbars class="ion-text-center" [class.ion-padding]="!loading()">
        @if (error()) {
          <p>暂时无法登录，请重试。</p>
          <ion-button (click)="initialize()">重试</ion-button>
        }
      </ion-content>
    }
    <ion-toast
      [isOpen]="updates.promptOpen()"
      message="新版本已准备好"
      [buttons]="[
        { text: '暂不更新', role: 'cancel' },
        { text: '立即更新', handler: updates.reload },
      ]"
      (didDismiss)="updates.dismiss()" />
  </ion-app>
}

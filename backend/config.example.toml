# For local development, copy this file to config.local.toml and set CHAHUA_CONFIG_PATH.
# Environment variables override application settings. Keep credentials in the environment.
# Uncomment the application settings you want to override.

# [server]
# app_addr = "0.0.0.0:3000"
# metrics_addr = "0.0.0.0:3001"
# cors_allowed_origins = ["https://chat.example.com"]

# PostgreSQL schema containing the Discuz user and usergroup tables.
# [discuz]
# schema = "discuz"

# [logging]
# format = "json"
# filter = "info"

# [media]
# bucket = "chahua-media"
# attachment_prefix = "attachments"
# max_attachment_file_size_bytes = 52428800
# region = "us-west-2"
# endpoint_url = "http://127.0.0.1:19000"
# base_url = "https://media.example.com"
# upload_proxy_path = "/_storage"

# Debug builds always enable development authentication, regardless of this flag.
# [auth]
# debug_auth_enabled = false

# Users whose primary group ID is in this list cannot write to group chats.
# [group_chat.write]
# restricted_user_group_ids = []

# [ids]
# node_id = 0 # Unique per instance; 0..15.

# [message_search]
# enabled = false
# index_uid = "messages_v1"
# meili_url = "http://127.0.0.1:17700"
# MEILI_MASTER_KEY remains an environment variable.

# Keep committed timeline changes for reconnect (1–2160 hours).
# [message_sync]
# retention_hours = 72

# Keep native-list removal stamps (1–365 days).
# [list_sync]
# retention_days = 30

# [push]
# vapid_subject = "mailto:admin@example.com"
# vapid_public_key = "..." # Public metadata; VAPID_PRIVATE_KEY stays in env.

# [push.apns]
# key_id = "..."
# team_id = "..."
# topic = "app.example.chahua"
# APNS_PRIVATE_KEY_PATH stays in env and points to the existing private-key file.

# [push.fcm]
# project_id = "Your FCM project ID"
# FCM_SERVICE_ACCOUNT_PATH stays in env and points to the Firebase
# service-account JSON ("Firebase Admin SDK" private key).

# [avatars]
# public_url = "https://avatars.example.com"
# path = "/srv/discuz/uc_server/data/avatar"

# Add site rules to your deployment config to enable exact-host handlers or headers.
# Each rule accepts host or hosts. With no handler, the host uses generic previews.
# [[link_previews.sites]]
# hosts = ["example.net", "www.example.net"]
# handler = "generic"
# headers = { User-Agent = "chahua-link-preview/1.0" }

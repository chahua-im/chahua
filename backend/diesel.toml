[print_schema]
file = "src/schema/primary.rs"
custom_type_derives = ["diesel::query_builder::QueryId"]
# Bundle child IDs are always non-null; retain the existing Rust Vec<i64> contract.
patch_file = "src/schema/primary.patch"

[print_schema.discuz]
schema = "discuz"
file = "src/schema/discuz.rs"
filter = { except_tables = ["^common_member_profile$"] }

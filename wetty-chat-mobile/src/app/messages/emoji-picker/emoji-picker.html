<emoji-picker
  locale="zh"
  data-source="/emoji/data.json"
  [i18n]="{
    categoriesLabel: '类别',
    emojiUnsupportedMessage: '浏览器不支持彩色表情。',
    favoritesLabel: '常用',
    loadingMessage: '正在加载…',
    networkErrorMessage: '表情加载失败，请重新打开重试。',
    regionLabel: '选择表态表情',
    searchDescription: '使用上下方向键选择搜索结果，按回车确认。',
    searchLabel: '搜索表情',
    searchResultsLabel: '搜索结果',
    skinToneDescription: '使用上下方向键选择肤色，按回车确认。',
    skinToneLabel: '选择肤色（当前为 {skinTone}）',
    skinTonesLabel: '肤色',
    skinTones: ['默认', '浅色', '较浅', '中等', '较深', '深色'],
    categories: {
      custom: '自定义',
      'smileys-emotion': '笑脸和表情',
      'people-body': '人物和身体',
      'animals-nature': '动物与自然',
      'food-drink': '食品饮料',
      'travel-places': '旅行和地点',
      activities: '活动',
      objects: '物品',
      symbols: '符号',
      flags: '旗帜',
    },
  }"

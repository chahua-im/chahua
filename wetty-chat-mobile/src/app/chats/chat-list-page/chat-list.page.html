@if (!wide()) {
  <app-chat-list [selection]="selection()" [active]="listActive()"></app-chat-list>
}
<div class="ion-page ion-hide-md-down">
  <ion-header>
    <ion-toolbar><ion-title>茶话</ion-title></ion-toolbar>
  </ion-header>
  <ion-content>
    <div class="empty-state ion-padding ion-text-center">
      <ion-icon [icon]="chatIcon"></ion-icon>
      <h1>开始聊天</h1>
      <p>从左侧选择一个会话</p>
    </div>
  </ion-content>
</div>
